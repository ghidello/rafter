name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the validated Ubuntu baseline stable when ubuntu-latest migrates to 26.04.
        os: [windows-latest, ubuntu-24.04, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Rafter.slnx --configfile nuget.config

      - name: Record runtime environment
        run: dotnet --info

      - name: Build
        run: dotnet build Rafter.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format Rafter.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        timeout-minutes: 5
        run: >-
          dotnet test Rafter.slnx --configuration Release --no-build
          --diagnostic-output-directory artifacts/test-results/${{ matrix.os }}/diagnostics
          --diagnostic --diagnostic-verbosity Information --report-xunit-trx
          --timeout 2m --long-running 30 --output Detailed
          ${{ matrix.os == 'macos-latest' && '--filter-not-class Sotsera.Rafter.Tests.PhaseSevenProcessTests' || '' }}

      # Separate process tests expose the last started method even if the hosted runner loses its logs.
      - name: macOS process test - CapturesExactArgumentTokensAndWorkingDirectory
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.CapturesExactArgumentTokensAndWorkingDirectory
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - DrainsBothStreamsBeyondPipeCapacityWithoutDeadlock
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.DrainsBothStreamsBeyondPipeCapacityWithoutDeadlock
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - ReportsCaptureOverflowAfterTheChildExits
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.ReportsCaptureOverflowAfterTheChildExits
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - RejectsMalformedUtf8WithoutReplacementText
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.RejectsMalformedUtf8WithoutReplacementText
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - PreservesALeadingUtf8BomAsProcessData
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.PreservesALeadingUtf8BomAsProcessData
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - CapturesUtf8SplitAcrossEveryPossibleRuneBoundary
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.CapturesUtf8SplitAcrossEveryPossibleRuneBoundary
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - AcceptsCaptureExactlyAtThePerStreamLimit
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.AcceptsCaptureExactlyAtThePerStreamLimit
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - ReportsSpecificationDiagnosticsInAuthoredOrderWithoutLaunching
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.ReportsSpecificationDiagnosticsInAuthoredOrderWithoutLaunching
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - UsesOneMarkerSafeForInvocationAndProcessLocalSecrets
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.UsesOneMarkerSafeForInvocationAndProcessLocalSecrets
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - PreservesCompleteCaptureOnAnExplicitlyInvalidExit
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.PreservesCompleteCaptureOnAnExplicitlyInvalidExit
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - ReturnsAnExplicitlyValidNonzeroStreamingExit
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.ReturnsAnExplicitlyValidNonzeroStreamingExit
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - ReportsAStreamingInvalidExitWithoutRetainingCapture
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.ReportsAStreamingInvalidExitWithoutRetainingCapture
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - ReportsStartupFailureButHonorsPreCancellationBeforeLaunch
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.ReportsStartupFailureButHonorsPreCancellationBeforeLaunch
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - ReusesAnImmutableBuilderForConcurrentIndependentLaunches
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.ReusesAnImmutableBuilderForConcurrentIndependentLaunches
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - RejectsCapturePolicyInStreamingModeBeforeLaunch
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.RejectsCapturePolicyInStreamingModeBeforeLaunch
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - AppliesOrderedEnvironmentEditsWithoutMutatingTheParent
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.AppliesOrderedEnvironmentEditsWithoutMutatingTheParent
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - ResolvesTheProcessWorkingDirectoryFromTheTargetDirectory
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.ResolvesTheProcessWorkingDirectoryFromTheTargetDirectory
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - AuthoredTimeoutTerminatesTheDirectChild
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.AuthoredTimeoutTerminatesTheDirectChild
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: Verify independent process-test watchdog
        if: matrix.os == 'macos-latest'
        timeout-minutes: 1
        run: python3 eng/test-watch-process-test.py

      - name: macOS runtime-only process-tree diagnostic
        if: matrix.os == 'macos-latest'
        timeout-minutes: 3
        run: >-
          python3 eng/watch-process-test.py --
          dotnet run eng/diagnose-process-tree.cs --configuration Release --
          artifacts/bin/Sotsera.Rafter.ProcessFixture/release/Sotsera.Rafter.ProcessFixture

      - name: macOS runtime-only process-tree diagnostic with console signals
        if: matrix.os == 'macos-latest'
        timeout-minutes: 3
        run: >-
          python3 eng/watch-process-test.py --
          dotnet run eng/diagnose-process-tree.cs --configuration Release --no-build --
          artifacts/bin/Sotsera.Rafter.ProcessFixture/release/Sotsera.Rafter.ProcessFixture --console-signals

      - name: macOS process test - AuthoredTimeoutTerminatesAReportedProcessTree
        if: matrix.os == 'macos-latest'
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Process-tree timeout verification $attempt of 5"
            python3 eng/watch-process-test.py -- \
              dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj \
              --configuration Release --no-build \
              --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.AuthoredTimeoutTerminatesAReportedProcessTree \
              --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx
          done

      - name: macOS process test - InvocationCancellationPreservesStandardCancellationClassification
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.InvocationCancellationPreservesStandardCancellationClassification
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - ADiscardedActiveProcessFailsAndIsSettledBeforeTheCallbackCloses
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.ADiscardedActiveProcessFailsAndIsSettledBeforeTheCallbackCloses
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - FailsWithinTheDrainDeadlineWhenADescendantRetainsPipes
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.FailsWithinTheDrainDeadlineWhenADescendantRetainsPipes
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx

      - name: macOS process test - TransfersNonSettlingTeardownToTheTrackedReaper
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: >-
          dotnet test --project tests/Sotsera.Rafter.Tests/Sotsera.Rafter.Tests.csproj
          --configuration Release --no-build
          --filter-method Sotsera.Rafter.Tests.PhaseSevenProcessTests.TransfersNonSettlingTeardownToTheTrackedReaper
          --timeout 45s --minimum-expected-tests 1 --output Detailed --report-xunit-trx


      - name: Run execution fixture
        run: >-
          dotnet run --project test-assets/Sotsera.Rafter.RunFixture/Sotsera.Rafter.RunFixture.csproj
          --configuration Release --no-build -- --help --plain

      - name: Run process fixture
        run: >-
          dotnet run --project test-assets/Sotsera.Rafter.ProcessFixture/Sotsera.Rafter.ProcessFixture.csproj
          --configuration Release --no-build -- emit --stdout fixture-ready

      - name: Verify implemented examples
        shell: pwsh
        run: ./eng/verify-implemented-examples.ps1 -Configuration Release

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            artifacts/test-results/
            artifacts/example-verification/
            artifacts/process-tree-probe/
          if-no-files-found: ignore

  package:
    name: Package integrity
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore Rafter.slnx --configfile nuget.config
      - run: dotnet build Rafter.slnx --configuration Release --no-restore
      - run: dotnet pack src/Sotsera.Rafter/Sotsera.Rafter.csproj --configuration Release --no-build
      - shell: pwsh
        run: ./eng/verify-package.ps1 -Configuration Release
      - shell: pwsh
        run: ./eng/validate-examples.ps1
      - run: git diff --exit-code -- examples

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/package/
          if-no-files-found: error
