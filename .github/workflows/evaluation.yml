name: Evaluation

on:
  push:
    branches: [main, 'build/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-evaluation:
    name: Windows evaluation
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Record environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet --info | Tee-Object artifacts/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture |
            Out-File artifacts/windows-info.txt
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion" | Out-File artifacts/runner-image.txt

      - name: Restore
        run: dotnet restore tests/Rafter.Evaluation.Tests/Rafter.Evaluation.Tests.csproj

      - name: Build
        run: dotnet build tests/Rafter.Evaluation.Tests/Rafter.Evaluation.Tests.csproj --configuration Release --no-restore -bl:artifacts/build.binlog

      - name: Run evaluation
        run: dotnet test --project tests/Rafter.Evaluation.Tests/Rafter.Evaluation.Tests.csproj --configuration Release --no-build --report-trx --results-directory artifacts/test-results

      - name: Retain evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-evaluation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
